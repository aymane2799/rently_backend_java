spring:
  application:
    name: KiraDrive

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        multiTenancy: SCHEMA

  # Flyway — database migration tool
  flyway:
    enabled: false
    locations: classpath:db/migration
    baseline-on-migrate: false

# Spring Boot Actuator — which endpoints to expose
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized

# JWT configuration
jwt:
  secret: ${JWT_SECRET:kiradrive-default-secret-key-change-in-production-must-be-256-bits}
  expiration: ${JWT_EXPIRATION:86400000}   # 24 hours in ms

# Document generation storage
document:
  storage:
    path: ${DOCUMENT_STORAGE_PATH:./documents}
